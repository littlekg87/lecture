<section class="body"><p class="ey">국내외 연구 동향</p><h2>디지털역사학은 어떤 규모로 이루어지고 있는가</h2><div class="columns"><div><h3>해외</h3><div class="item"><b>홀로코스트 사료 포털</b><p>유럽 홀로코스트 연구 인프라(EHRI-ERIC) 출범. 10개 창립국이 분산된 사료의 탐색과 연구를 지원한다.</p></div><div class="item"><b>근세 유럽 지식인의 편지</b><p>스탠퍼드 연구진은 편지·여행 기록으로 지식인의 교류가 어떤 경로로 이루어졌는지 추적한다.</p></div></div><div><h3>한국</h3><div class="item"><b>근현대 동아시아의 탄소 레짐</b><p>서강대 조은성 연구팀은 GIS로 석탄의 생산·유통·소비망을 복원한다. 인문사회연구소지원사업, 6년.</p></div><div class="item"><b>냉전기 항구도시 부산의 구호물자</b><p>국립부경대 한봉석 연구팀은 구호물자 기록을 DB로 구축해 부산의 구호·유통 경로를 추적한다. AKS 한국학지역거점연구소, 3년.</p></div></div></div><div class="src"><a href="https://www.ehri.be/services/">EHRI-ERIC ↗</a>　·　<a href="https://republicofletters.stanford.edu/">Mapping the Republic of Letters</a>　·　<a href="https://www.kadh.org/조은성-서강대학교-근현대-동아시아-탄소-레짐의/">KADH / NRF</a>　·　<a href="https://www.kadh.org/한봉석-국립부경대학교-냉전기-부산의-구호물자db화/">KADH / AKS</a></div></section>
<section class="blue chapter folio c1"><div class="folionum" aria-hidden="true">01</div><div class="chapLabel">제1장</div><h1>디지털역사학의 현황</h1></section>
<section class="body chron"><p class="ey">Ⅰ　현황</p><h2>시대순으로 보면 무엇이 빠지는가</h2><div class="stations"><div><span data-icon="text"></span><b>자료 전산화</b></div><div><span data-icon="db"></span><b>DB 편찬</b></div><div><span data-icon="stats"></span><b>디지털 분석</b></div><div><span data-icon="chip"></span><b>AI 활용</b></div></div><div class="current"><h3>오늘날 네 작업은 동시에 이루어진다</h3><div class="duo"><div><b>기술 변화의 속도</b><p>AI가 초벌 판독을 맡아도 연구자는 이본을 대조하며 원문을 확정한다.</p></div><div><b>연구 기능의 분화</b><p>같은 사료를 두고도 편찬자, 도구 개발자, 역사 연구자가 서로 다른 성과를 낸다.</p></div></div></div><div class="src">김근하 (2026), 『역사논총』 53, 378–388.</div></section>
<section class="body compare"><p class="ey">Ⅰ　현황</p><h2>연구 목적과 성과물로 읽는 두 유형</h2><div class="pair"><article class="plate"><span data-icon="db"></span><h3>디지털 연구환경 구축형</h3><p>무엇을 검색하고<br>비교할 수 있게 했는가?</p><footer><strong>시기별 행정경계 복원</strong><br>출전과 비정 근거를 갖춘 공간 데이터</footer></article><article class="plate"><span data-icon="net"></span><h3>역사문제 탐구형</h3><p>어떤 역사적 질문에<br>어떤 증거로 답했는가?</p><footer><strong>지역 시장권의 형성 탐구</strong><br>공간자료에 근거한 역사적 설명</footer></article></div><div class="src">국내외 대표 연구 약 60건 검토 · 전근대 한문사료 연구 우선 · 김근하 (2026), 380–389.</div></section>
<section class="body studies build"><p class="ey">Ⅰ　현황</p><h2>디지털 연구환경은 어떻게 구축하는가</h2><div class="methods"><button class="method" type="button"><span data-icon="db"></span><b>DB·온톨로지</b><small>인물과 출전</small></button><button class="method" type="button"><span data-icon="map"></span><b>공간정보</b><small>역사 GIS</small></button><button class="method" type="button"><span data-icon="chip"></span><b>알고리즘·AI</b><small>사료 처리와 검색</small></button></div><div class="panels" aria-live="polite"><article class="case" hidden><b>방목마다 다른 기재를 어떻게 대조할까?</b><p>급제자·방목·출전을 연결해 각 이본의 누락과 차이를 추적할 수 있는 데이터 구조를 제안했다.</p><div class="citation">이재옥 (2021), 「온톨로지를 이용한 문과방목의 정본화 연구」, 『인문콘텐츠』 60.</div></article><article class="case" hidden><b>1910년의 면 경계를 어떻게 복원할까?</b><p>행정구역 명칭 자료와 근대 지형도를 대조해 면 단위 경계를 복원하고, 후속 연구자가 활용할 공간 데이터를 마련했다.</p><div class="citation">정요근·김현종 (2022), 「역사 GIS 기반 1910년 기준 면(面) 단위 행정구역의 복원」, 『한국사연구』 197.</div></article><article class="case" hidden><b>같은 사료와 같은 AI에서 왜 답이 달라질까?</b><p>『세종실록지리지』 원문을 넣으면 서술 맥락이, 군현별 표를 넣으면 수치와 비율이 두드러졌다. 광역 집계에서는 두 방식 모두 한계가 있었다.</p><div class="citation"><a href="https://doi.org/10.17260/jklc.2026.74..49">김근하 (2026), 「데이터는 어떻게 AI의 답변을 바꾸는가」, 『한문학논집』 74. ↗</a></div></article></div><p class="take">DB 편찬은 여전히 핵심 과업이다. 편찬의 속도와 정확도를 높이는 방법도 독립적인 연구 주제가 되었다.</p></section>
<section class="body studies inquiry"><p class="ey">Ⅰ　현황</p><h2>디지털 분석은 기존 학설을 어디까지 정교화하는가</h2><div class="methods"><button class="method" type="button"><span data-icon="map"></span><b>공간</b><small>HGIS</small></button><button class="method" type="button"><span data-icon="net"></span><b>관계</b><small>네트워크 분석</small></button><button class="method" type="button"><span data-icon="text"></span><b>언어</b><small>텍스트마이닝</small></button><button class="method" type="button"><span data-icon="stats"></span><b>분포와 변화</b><small>통계 분석</small></button><button class="method" type="button"><span data-icon="mix"></span><b>복합 설명</b><small>융합 분석</small></button></div><div class="panels" aria-live="polite"><article class="case" hidden><b>조선 초기 수군은 어느 군현에 등재되었나?</b><p>전국 334개 군현의 병종별 편성을 비교했다. 경상·전라·충청도에서는 내륙 군현에서도 등재 군정의 약 3분의 2가 수군이었다.</p><div class="citation"><a href="https://www.kci.go.kr/kciportal/landing/article.kci?arti_id=ART003394577">김근하 (2026), 「조선 초기 군정(軍丁)의 전국적 분포와 병종별 지역 편성」, 『역사연구』 57. ↗</a></div></article><article class="case" hidden><b>고구려와 백제의 외교망은 어떻게 달랐나?</b><p>동진·16국 시기의 교섭 343건을 7개 시기로 나누었다. 고구려는 화북과 강남에 걸쳐 관계를 맺었고, 백제의 교섭은 동진에 집중되었다.</p><div class="citation">임동민 (2025), 「동진·16국 시기 교섭 데이터의 네트워크 분석」, 『한국고대사연구』 118.</div></article><article class="case" hidden><b>정조대 『일성록』에서 어떤 주제의 비중이 달라졌나?</b><p>구조적 토픽 모델로 약 30개 주제를 추출하고, 연도별 주제 비중의 변화를 정치적 시기와 연결해 해석했다.</p><div class="citation">정성훈 (2023), 「구조적 토픽 모델을 활용한 일성록 분석」, 『한문학논집』 64.</div></article><article class="case" hidden><b>경상도에서 등재 호수와 군정 규모는 어떻게 연결되었나?</b><p>66개 군현의 기록에서 등재 호수와 군정 인원은 거의 비례했다. 추정 탄력성은 0.968로, 비례관계를 뜻하는 1과 통계적으로 구별되지 않았다.</p><div class="citation"><a href="https://doi.org/10.15186/ikc.2026.8.31.04">김근하 (2026), 「조선 초기 경상도 호구·병종의 분포 특징」, 『민족문화논총』 93. ↗</a></div></article><article class="case" hidden><b>군역 부담의 격차는 도 사이와 도 안 중 어디에서 컸나?</b><p>334개 군현의 호·군정 기록을 GIS로 시각화하고 타일지수로 불평등을 분해했다. 전체 격차의 61%가 같은 도 안의 군현 사이에서 나타났다.</p><div class="citation"><a href="https://www.kci.go.kr/kciportal/landing/article.kci?arti_id=ART003255692">김근하·우동현 (2025), 「조선 전기 군역의 형평성 측정」, 『역사와 현실』 137. ↗</a></div></article></div><p class="take">여러 지역과 시기를 함께 비교하면 기존 설명의 범위와 예외, 개별 사례에서 보기 어려웠던 패턴이 드러난다.</p></section>
<section class="blue chapter folio c2"><div class="folionum" aria-hidden="true">02</div><div class="chapLabel">제2장</div><h1>디지털역사학의 확장 가능성</h1></section>
<section class="body collab compact"><p class="ey">Ⅱ　확장 가능성</p><h2>공동연구의 확장 가능성</h2><div class="pair"><article class="collcard"><span data-icon="db"></span><b>디지털 연구환경 구축형</b><h3>국가와 학문 분야를 넘어<br>연구환경을 함께 구축한다.</h3></article><article class="collcard"><span data-icon="net"></span><b>역사문제 탐구형</b><h3>공동 연구 의제를 발굴해<br>HK·BK·연구소지원사업으로 연결한다.</h3></article></div></section>
<section class="body courses"><p class="ey">Ⅱ　확장 가능성</p><h2>학부 사료 실습에서 대학원 공동연구까지</h2><div class="lessons"><div class="lesson"><div class="levelHead"><span data-icon="book"></span><small>학부 기초</small><h3>사료의 데이터화</h3></div><div><b>디지털역사학 입문 · 역사데이터의 이해 · 역사DB의 구축</b><p>기초 코딩으로 사료를 정리하고 출전을 기록한 DB를 만든다.</p></div></div><div class="lesson"><div class="levelHead"><span data-icon="stats"></span><small>학부 심화</small><h3>방법과 전공의 결합</h3></div><div><b>GIS와 역사지리의 이해 · 텍스트마이닝으로 분석하는 역사사료</b><p>전공 수업의 질문을 GIS·텍스트마이닝으로 검토해 연구보고서를 쓴다.</p></div></div><div class="lesson"><div class="levelHead"><span data-icon="net"></span><small>대학원</small><h3>공동연구 설계</h3></div><div><b>디지털역사학 연구설계 세미나</b><p>공동 데이터셋을 구축하고 각자의 역사적 질문을 학위논문으로 발전시킨다.</p></div></div></div></section>
<section class="end closing"><div class="closeRule"></div><h2>역사학자가 해오던 일을<br><em>더 잘할 수 있습니다.</em></h2><p>더 넓은 사료에서 얻은 설명이 개별 기록에서도 성립하는지 검증하는 일. 디지털역사학은 그 작업의 범위를 넓힙니다.</p><a class="shareQR" href="https://littlekg87.github.io/lecture/2026_Keimyung/" target="_blank" rel="noopener"><svg viewBox="0 0 41 41" aria-hidden="true" shape-rendering="crispEdges"><rect width="100%" height="100%" fill="white"/><path d="M4,4h1v1h-1zM5,4h1v1h-1zM6,4h1v1h-1zM7,4h1v1h-1zM8,4h1v1h-1zM9,4h1v1h-1zM10,4h1v1h-1zM13,4h1v1h-1zM14,4h1v1h-1zM20,4h1v1h-1zM23,4h1v1h-1zM24,4h1v1h-1zM27,4h1v1h-1zM30,4h1v1h-1zM31,4h1v1h-1zM32,4h1v1h-1zM33,4h1v1h-1zM34,4h1v1h-1zM35,4h1v1h-1zM36,4h1v1h-1zM4,5h1v1h-1zM10,5h1v1h-1zM13,5h1v1h-1zM14,5h1v1h-1zM16,5h1v1h-1zM19,5h1v1h-1zM20,5h1v1h-1zM22,5h1v1h-1zM24,5h1v1h-1zM25,5h1v1h-1zM28,5h1v1h-1zM30,5h1v1h-1zM36,5h1v1h-1zM4,6h1v1h-1zM6,6h1v1h-1zM7,6h1v1h-1zM8,6h1v1h-1zM10,6h1v1h-1zM12,6h1v1h-1zM14,6h1v1h-1zM15,6h1v1h-1zM16,6h1v1h-1zM18,6h1v1h-1zM20,6h1v1h-1zM25,6h1v1h-1zM26,6h1v1h-1zM30,6h1v1h-1zM32,6h1v1h-1zM33,6h1v1h-1zM34,6h1v1h-1zM36,6h1v1h-1zM4,7h1v1h-1zM6,7h1v1h-1zM7,7h1v1h-1zM8,7h1v1h-1zM10,7h1v1h-1zM12,7h1v1h-1zM14,7h1v1h-1zM15,7h1v1h-1zM22,7h1v1h-1zM23,7h1v1h-1zM26,7h1v1h-1zM27,7h1v1h-1zM28,7h1v1h-1zM30,7h1v1h-1zM32,7h1v1h-1zM33,7h1v1h-1zM34,7h1v1h-1zM36,7h1v1h-1zM4,8h1v1h-1zM6,8h1v1h-1zM7,8h1v1h-1zM8,8h1v1h-1zM10,8h1v1h-1zM12,8h1v1h-1zM15,8h1v1h-1zM17,8h1v1h-1zM18,8h1v1h-1zM19,8h1v1h-1zM20,8h1v1h-1zM24,8h1v1h-1zM25,8h1v1h-1zM27,8h1v1h-1zM30,8h1v1h-1zM32,8h1v1h-1zM33,8h1v1h-1zM34,8h1v1h-1zM36,8h1v1h-1zM4,9h1v1h-1zM10,9h1v1h-1zM12,9h1v1h-1zM14,9h1v1h-1zM15,9h1v1h-1zM16,9h1v1h-1zM18,9h1v1h-1zM23,9h1v1h-1zM25,9h1v1h-1zM26,9h1v1h-1zM30,9h1v1h-1zM36,9h1v1h-1zM4,10h1v1h-1zM5,10h1v1h-1zM6,10h1v1h-1zM7,10h1v1h-1zM8,10h1v1h-1zM9,10h1v1h-1zM10,10h1v1h-1zM12,10h1v1h-1zM14,10h1v1h-1zM16,10h1v1h-1zM18,10h1v1h-1zM20,10h1v1h-1zM22,10h1v1h-1zM24,10h1v1h-1zM26,10h1v1h-1zM28,10h1v1h-1zM30,10h1v1h-1zM31,10h1v1h-1zM32,10h1v1h-1zM33,10h1v1h-1zM34,10h1v1h-1zM35,10h1v1h-1zM36,10 <section class="body"><p class="ey">International and Korean projects</p><h2>At what scale is digital history being practiced?</h2><div class="columns"><div><h3>International</h3><div class="item"><b>Holocaust archives portal</b><p>Ten founding countries launched EHRI-ERIC to support research across dispersed collections.</p></div><div class="item"><b>Letters from early modern Europe</b><p>Stanford researchers traced intellectual exchange through correspondence and travel records.</p></div></div><div><h3>Korea</h3><div class="item"><b>East Asia’s carbon regime</b><p>Eunsung Cho’s Sogang team uses GIS to trace coal production, trade and use. NRF institute grant, six years.</p></div><div class="item"><b>Relief supplies in the port city of Busan</b><p>Bongseok Han’s Pukyong team maps Cold War relief flows from distribution records. AKS regional institute grant, three years.</p></div></div></div><div class="src"><a href="https://www.ehri.be/services/">EHRI-ERIC ↗</a>　·　<a href="https://republicofletters.stanford.edu/">Mapping the Republic of Letters</a>　·　<a href="https://www.kadh.org/조은성-서강대학교-근현대-동아시아-탄소-레짐의/">KADH / NRF</a>　·　<a href="https://www.kadh.org/한봉석-국립부경대학교-냉전기-부산의-구호물자db화/">KADH / AKS</a></div></section>
<section class="blue chapter folio c1"><div class="folionum" aria-hidden="true">01</div><div class="chapLabel">Chapter 1</div><h1>Digital History Today</h1></section>
<section class="body chron"><p class="ey">Ⅰ　The field today</p><h2>What does a chronology leave out?</h2><div class="stations"><div><span data-icon="text"></span><b>Digitization</b></div><div><span data-icon="db"></span><b>Database editing</b></div><div><span data-icon="stats"></span><b>Digital analysis</b></div><div><span data-icon="chip"></span><b>AI tools</b></div></div><div class="current"><h3>Today, all four activities coexist</h3><div class="duo"><div><b>Rapid technological change</b><p>AI-assisted transcription and scholarly collation can be part of the same edition.</p></div><div><b>Specialized research roles</b><p>Source editors, tool builders and historians can produce different kinds of scholarship from the same records.</p></div></div></div><div class="src">김근하 (2026), 『역사논총』 53, 378–388.</div></section>
<section class="body compare"><p class="ey">Ⅰ　The field today</p><h2>Two research purposes, two kinds of output</h2><div class="pair"><article class="plate"><span data-icon="db"></span><h3>Building research environments</h3><p>What can scholars now<br>find and compare?</p><footer><strong>Reconstructing boundaries</strong><br>Spatial data with sources and location evidence</footer></article><article class="plate"><span data-icon="net"></span><h3>Investigating historical questions</h3><p>What historical question<br>can the evidence answer?</p><footer><strong>Explaining regional markets</strong><br>A historical explanation grounded in spatial data</footer></article></div><div class="src">Around 60 studies, with emphasis on premodern sources in literary Chinese · 김근하 (2026), 380–389.</div></section>
<section class="body studies build"><p class="ey">Ⅰ　The field today</p><h2>How are digital research environments built?</h2><div class="methods"><button class="method" type="button"><span data-icon="db"></span><b>Databases</b><small>Entities and sources</small></button><button class="method" type="button"><span data-icon="map"></span><b>Spatial data</b><small>Historical GIS</small></button><button class="method" type="button"><span data-icon="chip"></span><b>Algorithms and AI</b><small>Source processing</small></button></div><div class="panels" aria-live="polite"><article class="case" hidden><b>How can scholars compare conflicting register entries?</b><p>Linking each graduate to registers and sources makes omissions and variant entries traceable.</p><div class="citation">Lee Jae-ok (2021), on an ontology for collating civil-service examination registers, 인문콘텐츠 60.</div></article><article class="case" hidden><b>How can township boundaries be reconstructed for 1910?</b><p>Administrative records and topographic maps were compared to reconstruct township boundaries and produce reusable spatial data.</p><div class="citation">Jeong Yo-geun and Kim Hyeon-jong (2022), on reconstructing township boundaries in 1910, 한국사연구 197.</div></article><article class="case" hidden><b>Why does the same AI give different answers from the same source?</b><p>With the same model, the original text elicited contextual detail and county tables elicited figures and ratios. Both struggled with regional aggregates.</p><div class="citation"><a href="https://doi.org/10.17260/jklc.2026.74..49">Kun-ha Kim (2026), “How Does Data Shape AI Responses?”, 한문학논집 74. ↗</a></div></article></div><p class="take">Database compilation remains central. Improving its speed and accuracy has become a research question in its own right.</p></section>
<section class="body studies inquiry"><p class="ey">Ⅰ　The field today</p><h2>How does digital analysis refine historical explanations?</h2><div class="methods"><button class="method" type="button"><span data-icon="map"></span><b>Space</b><small>HGIS</small></button><button class="method" type="button"><span data-icon="net"></span><b>Relations</b><small>Networks</small></button><button class="method" type="button"><span data-icon="text"></span><b>Language</b><small>Text mining</small></button><button class="method" type="button"><span data-icon="stats"></span><b>Distribution</b><small>Statistics</small></button><button class="method" type="button"><span data-icon="mix"></span><b>Synthesis</b><small>Mixed methods</small></button></div><div class="panels" aria-live="polite"><article class="case" hidden><b>Where were naval personnel registered in early Joseon?</b><p>Across 334 counties, mapping service categories revealed an inland naval base of recruitment. In the inland counties of three southern provinces, roughly two-thirds of registrants were naval personnel.</p><div class="citation"><a href="https://www.kci.go.kr/kciportal/landing/article.kci?arti_id=ART003394577">Kun-ha Kim (2026), “Where the Troops Were Registered,” 역사연구 57. ↗</a></div></article><article class="case" hidden><b>How did the diplomatic networks of Goguryeo and Baekje differ?</b><p>Across 343 contacts in seven periods, Goguryeo maintained ties in northern and southern China, while Baekje concentrated its diplomacy on Eastern Jin.</p><div class="citation">Im Dong-min (2025), on diplomatic networks during the Eastern Jin and Sixteen Kingdoms, 한국고대사연구 118.</div></article><article class="case" hidden><b>Which topics gained or lost prominence in the Ilseongnok?</b><p>A structural topic model identified about thirty topics. Changes in their prominence were interpreted in the political context of Jeongjo’s reign.</p><div class="citation">Jeong Seong-hun (2023), on structural topic modeling of the Ilseongnok, 한문학논집 64.</div></article><article class="case" hidden><b>How closely did registrant totals track household counts in Gyeongsang?</b><p>In 66 counties, registered personnel rose almost proportionately with registered households. The estimated elasticity of 0.968 was statistically indistinguishable from one.</p><div class="citation"><a href="https://doi.org/10.15186/ikc.2026.8.31.04">Kun-ha Kim (2026), on households and military service categories in Gyeongsang, 민족문화논총 93. ↗</a></div></article><article class="case" hidden><b>Did disparities in military obligations arise within or between provinces?</b><p>GIS mapped the records of 334 counties. Decomposing the Theil index showed that 61% of inequality arose between counties within the same province.</p><div class="citation"><a href="https://www.kci.go.kr/kciportal/landing/article.kci?arti_id=ART003255692">Kun-ha Kim and Donghyun Woo (2025), “Measuring Equity in Early Joseon Military Service,” 역사와 현실 137. ↗</a></div></article></div><p class="take">Comparison across regions and periods reveals the reach and limits of existing explanations, and patterns hidden in individual cases.</p></section>
<section class="blue chapter folio c2"><div class="folionum" aria-hidden="true">02</div><div class="chapLabel">Chapter 2</div><h1>Future Directions for Digital History</h1></section>
<section class="body collab compact"><p class="ey">Ⅱ　Future directions</p><h2>Directions for collaborative research</h2><div class="pair"><article class="collcard"><span data-icon="db"></span><b>Building research environments</b><h3>Build research infrastructure across countries and disciplines.</h3></article><article class="collcard"><span data-icon="net"></span><b>Investigating historical questions</b><h3>Develop shared research agendas for HK, BK and research institute grants.</h3></article></div></section>
<section class="body courses"><p class="ey">Ⅱ　Future directions</p><h2>From undergraduate source work to graduate research</h2><div class="lessons"><div class="lesson"><div class="levelHead"><span data-icon="book"></span><small>Undergraduate foundations</small><h3>Structuring sources</h3></div><div><b>Introduction to Digital History · Understanding Historical Data · Building Historical Databases</b><p>Students use basic coding to build a source-linked database.</p></div></div><div class="lesson"><div class="levelHead"><span data-icon="stats"></span><small>Advanced undergraduate</small><h3>Applying methods</h3></div><div><b>GIS and Historical Geography · Analyzing Historical Sources with Text Mining</b><p>Students investigate a historical question using GIS or text mining.</p></div></div><div class="lesson"><div class="levelHead"><span data-icon="net"></span><small>Graduate seminar</small><h3>Designing research</h3></div><div><b>Research Design in Digital History</b><p>Students build a shared dataset and develop individual thesis projects.</p></div></div></div></section>

$('menu').textContent=tr('☰ 목차','☰ Contents');$('switcher').textContent=tr('ENG','한국어');$('reading').textContent=tr('읽기 모드','Reading');$('full').textContent=tr('전체 화면','Full screen');$('prev').ariaLabel=tr('이전','Previous');$('forward').ariaLabel=tr('다음','Next');$('closePanel').ariaLabel=tr('닫기','Close');
$('meter').replaceChildren();[...pages.children].forEach((s,i)=>{const b=document.createElement('button');b.title=(i+1)+'. '+title(s);b.ariaLabel=b.title;b.onclick=()=>go(i);$('meter').append(b)});render()}
function title(s){return s.querySelector('h1,h2').innerText.replace(/\n/g,' ')}
function resize(){stage.style.setProperty('--zoom',Math.min(innerWidth/1280,(innerHeight-46)/720))}
function render(){[...pages.children].forEach((s,i)=>s.classList.toggle('active',i===page));stage.dataset.step=page===3?step:1;$('counter').textContent=String(page+1).padStart(2,'0')+' / 11';$('prev').disabled=page===0;$('forward').disabled=page===10;[...$('meter').children].forEach((b,i)=>{b.classList.toggle('done',i<page);if(i===page)b.setAttribute('aria-current','step');else b.removeAttribute('aria-current')});$('reading').setAttribute('aria-pressed',document.body.classList.contains('reading'));$('full').setAttribute('aria-pressed',!!document.fullscreenElement)}
function go(i,st=0){page=Math.max(0,Math.min(10,i));step=st;render();window.scrollTo(0,0)}
function move(d){if(panel.open)return;if(page===3&&((d>0&&!step)||(d<0&&step))){step+=d;render()}else go(page+d,d<0&&page===4?1:0)}
function openPanel(h){$('panelTitle').textContent=h;content.replaceChildren();panel.showModal()}
function showMenu(){openPanel(tr('전체 목차','Contents'));[...pages.children].forEach((s,i)=>{const b=document.createElement('button');b.className='jump';b.textContent=String(i+1).padStart(2,'0')+'　'+title(s);if(i===page)b.setAttribute('aria-current','step');b.onclick=()=>{panel.close();go(i)};content.append(b)})}
$('menu').onclick=showMenu;$('closePanel').onclick=()=>panel.close();panel.onclick=e=>{if(e.target===panel&&!(e.clientX>=panel.getBoundingClientRect().left&&e.clientX<=panel.getBoundingClientRect().right&&e.clientY>=panel.getBoundingClientRect().top&&e.clientY<=panel.getBoundingClientRect().bottom))panel.close()};
$('prev').onclick=()=>move(-1);$('forward').onclick=()=>move(1);$('switcher').onclick=()=>{lang=tr('en','ko');setup()};$('reading').onclick=()=>{document.body.classList.toggle('reading');render();scrollTo(0,0)};$('full').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();
document.addEventListener('fullscreenchange',render);document.addEventListener('keydown',e=>{if(panel.open||e.ctrlKey||e.metaKey||e.altKey)return;if(e.key.toLowerCase()==='m'){showMenu();return}const d=['ArrowRight','ArrowDown','PageDown'].includes(e.key)?1:['ArrowLeft','ArrowUp','PageUp'].includes(e.key)?-1:0;if(d||e.key==='Home'||e.key==='End'||(e.code==='Space'&&!e.target.closest('a,button'))){e.preventDefault();if(e.key==='Home'||e.key==='End')go(e.key==='Home'?0:10);else move(d||1)}});
let lastWheel=0;window.addEventListener('wheel',e=>{if(panel.open||document.body.classList.contains('reading')||e.ctrlKey||Math.abs(e.deltaY)<16)return;e.preventDefault();const now=performance.now();if(now-lastWheel>450)move(Math.sign(e.deltaY));lastWheel=now},{passive:false});
let touch=null;stage.addEventListener('touchstart',e=>{touch=e.touches.length===1?e.touches[0].clientX:null},{passive:true});stage.addEventListener('touchend',e=>{if(touch!==null&&!panel.open){const dx=e.changedTouches[0].clientX-touch;if(Math.abs(dx)>75)move(dx<0?1:-1)}touch=null},{passive:true});
if(innerWidth<680)document.body.classList.add('reading');window.addEventListener('resize',resize);resize();setup();</script></body></html>
